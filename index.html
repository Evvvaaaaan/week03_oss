<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="과거 여행의 장면을 기록하고 돌아보는 여행 아카이브">
  <title>머문 장면 | 여행 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="my.css">
</head>
<body id="top">
  <nav class="navbar navbar-expand-lg site-nav"><div class="container-fluid page-shell">
    <a class="navbar-brand brand-mark" href="index.html">머문 장면</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="메뉴 열기"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
      <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">여행 기록</a></li>
      <li class="nav-item"><a class="nav-link" href="add.html">새 장면</a></li>
      <li class="nav-item"><a class="nav-link" href="example.html">Bootstrap Example</a></li>
    </ul></div>
  </div></nav>
  <main>
    <header class="hero page-shell"><p class="eyebrow">TRAVEL ARCHIVE · 2021—2026</p><div class="row align-items-end gy-4">
      <div class="col-lg-9"><h1>지나온 도시,<br>남아 있는 장면.</h1></div>
      <div class="col-lg-3 hero-copy"><p>다녀온 여행지를 사진과 짧은 기록으로<br class="mobile-break"> 모아두는 개인 여행 아카이브입니다.</p><a class="text-link" href="add.html">새 기록 남기기 <span aria-hidden="true">↗</span></a></div>
    </div></header>
    <section class="archive-section page-shell" aria-labelledby="archive-title">
      <div class="section-heading"><h2 id="archive-title">기억의 목록</h2><span id="placeCount">00 PLACES</span></div>
      <div class="row g-4 g-xl-5" id="travelGrid"></div>
    </section>
  </main>
  <footer class="site-footer"><div class="page-shell"><p>과거의 여행은 오늘의 감각이 됩니다.</p><div><span>© 2026 머문 장면</span><a href="#top">맨 위로 ↑</a></div></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="travel-store.js"></script>
  <script>
    const grid=document.getElementById("travelGrid");
    const travels=TravelStore.getAll();
    document.getElementById("placeCount").textContent=`${String(travels.length).padStart(2,"0")} PLACES`;
    travels.forEach((travel,index)=>{
      const column=document.createElement("div");column.className="col-md-6";
      const article=document.createElement("article");article.className=`travel-card${index%2 ? " offset-card" : ""}`;
      const imageLink=document.createElement("a");imageLink.className="card-image-link";imageLink.href=`view.html?id=${encodeURIComponent(travel.id)}`;imageLink.setAttribute("aria-label",`${travel.city} 여행 상세 보기`);
      const image=document.createElement("img");image.src=travel.image;image.alt=travel.alt||`${travel.city} 여행 사진`;
      const number=document.createElement("span");number.className="card-number";number.textContent=String(index+1).padStart(2,"0");
      imageLink.append(image,number);
      const copy=document.createElement("div");copy.className="card-copy";
      const text=document.createElement("div"),meta=document.createElement("p"),heading=document.createElement("h3"),titleLink=document.createElement("a");
      meta.className="card-meta";meta.textContent=`${travel.countryEn||travel.country.toUpperCase()} · ${TravelStore.formatDate(travel.date)}`;
      titleLink.href=imageLink.href;titleLink.textContent=`${travel.city}, ${travel.title}`;heading.append(titleLink);text.append(meta,heading);
      const rating=document.createElement("span");rating.className="rating";rating.setAttribute("aria-label",`만족도 ${travel.rating}점`);rating.textContent=`${"★".repeat(travel.rating)}${"☆".repeat(5-travel.rating)}`;
      copy.append(text,rating);article.append(imageLink,copy);column.append(article);grid.append(column);
    });
  </script>
</body>
</html>
